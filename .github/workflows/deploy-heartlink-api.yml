name: Heart Link API CI/CD

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'heartlink-api/**'
      - '.github/workflows/deploy-heartlink-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Laravel API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, sqlite3, pdo_sqlite, curl, xml, zip
          coverage: none

      - name: Validate Composer configuration
        working-directory: heartlink-api
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        working-directory: heartlink-api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check Laravel syntax
        working-directory: heartlink-api
        run: |
          find app routes config database -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l



  ssh-test:
    name: Test secure VPS connection
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Test VPS login
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'whoami && hostname'
